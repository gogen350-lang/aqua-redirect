<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подключение Aqua Stream...</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .loader { border: 4px solid #333; border-top: 4px solid #0088cc; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>Открываем приложение...</h2>
    <p>Если ничего не произошло, нажмите кнопку ниже:</p>
    <a id="manual-link" href="#" style="color: #0088cc; text-decoration: none; font-size: 18px;">Открыть вручную</a>

    <script>
        // Получаем параметры из ссылки (app и url)
        const urlParams = new URLSearchParams(window.location.search);
        const app = urlParams.get('app');
        const link = urlParams.get('url');

        if (app && link) {
            let finalUrl = '';
            
            // Формируем правильный диплинк
            if (app === 'happ') {
                // ИСПРАВЛЕННАЯ СТРОКА ДЛЯ HAPP:
                finalUrl = 'happ://add/' + link;
            } else if (app === 'hiddify') {
                finalUrl = 'hiddify://install-config?url=' + encodeURIComponent(link);
            } else if (app === 'v2ray') {
                finalUrl = 'v2ray://' + encodeURIComponent(link);
            }

            if (finalUrl) {
                // Подставляем ссылку в кнопку (на всякий случай)
                document.getElementById('manual-link').href = finalUrl;
                // Автоматически перекидываем пользователя
                window.location.href = finalUrl;
            } else {
                document.body.innerHTML = "<h2>Неизвестное приложение</h2>";
            }
        } else {
            document.body.innerHTML = "<h2>Ошибка: ссылка недействительна</h2>";
        }
    </script>
</body>
</html>
